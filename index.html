<!DOCTYPE html><!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONLINE JINRO - High Quality Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #06080e;
            --panel-bg: rgba(15, 21, 33, 0.88);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-red: #ff2a5f;
            --accent-blue: #00f0ff;
            --accent-gold: #ffb703;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glow-red: 0 0 20px rgba(255, 42, 95, 0.5);
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-gold: 0 0 20px rgba(255, 183, 3, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; justify-content: center;
            padding: 12px 8px; overflow-x: hidden; position: relative;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }

        .container {
            width: 100%; max-width: 1150px;
            display: flex; flex-direction: column; gap: 16px; z-index: 1;
        }

        .navbar {
            background: var(--panel-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border); padding: 12px 18px;
            border-radius: 18px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-img {
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--accent-blue); background: #1e293b; object-fit: cover;
            box-shadow: var(--glow-blue);
        }

        .pt-badge {
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #000;
            font-weight: 900; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;
            box-shadow: var(--glow-gold);
        }

        .main-layout { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 880px) { .main-layout { flex-direction: row; } }

        .game-panel {
            flex: 2.5; background: var(--panel-bg); backdrop-filter: blur(20px);
            padding: 24px; border-radius: 24px; border: 1px solid var(--panel-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); position: relative; overflow: hidden;
        }

        .game-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-purple), var(--accent-blue));
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .card-box {
            background: var(--panel-bg); backdrop-filter: blur(16px);
            padding: 18px; border-radius: 20px; border: 1px solid var(--panel-border);
        }

        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900;
            text-align: center; background: linear-gradient(90deg, #ff2a5f, #00f0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 3px; margin-bottom: 20px;
        }

        input, select, textarea {
            width: 100%; padding: 12px 14px; margin: 6px 0 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(8, 12, 20, 0.85);
            color: #fff; font-size: 0.9rem;
        }

        button {
            width: 100%; padding: 12px; margin: 4px 0; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--accent-red), #e11d48);
            color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s ease; box-shadow: var(--glow-red);
        }

        button:active { transform: scale(0.98); }
        .btn-secondary { background: linear-gradient(135deg, #334155, #1e293b); box-shadow: none; }
        .btn-gold { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; box-shadow: var(--glow-gold); }
        .btn-purple { background: linear-gradient(135deg, var(--accent-purple), #7c3aed); }
        .action-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #000; font-weight: 900; width: auto; padding: 6px 16px; font-size: 0.8rem; margin: 0;
            box-shadow: var(--glow-blue);
        }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 認証モーダル / コンテナ */
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .auth-tab-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); box-shadow: none; }
        .auth-tab-btn.active-tab { background: var(--accent-blue); color: #000; font-weight: 900; }

        /* 3Dカード */
        .card-container {
            perspective: 1000px; width: 100%; max-width: 220px; height: 110px;
            margin: 12px auto; cursor: pointer;
        }
        .flipper {
            width: 100%; height: 100%; transition: 0.6s transform;
            transform-style: preserve-3d; position: relative;
        }
        .card-container.flipped .flipper { transform: rotateY(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 14px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border: 1px solid var(--accent-gold);
            box-shadow: var(--glow-gold);
        }
        .card-front { background: rgba(15, 23, 42, 0.95); }
        .card-back { background: linear-gradient(135deg, #1e1b4b, #311042); transform: rotateY(180deg); }

        .timer-box {
            background: rgba(10, 15, 26, 0.9); padding: 14px; border-radius: 16px;
            text-align: center; font-family: 'Orbitron', sans-serif; font-size: 1.5rem;
            font-weight: 900; color: var(--accent-gold); margin-bottom: 16px;
            border: 1px solid var(--accent-gold); box-shadow: var(--glow-gold); letter-spacing: 2px;
        }

        .player-card {
            background: rgba(26, 36, 52, 0.7); padding: 12px 16px; margin: 8px 0;
            border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
            border-left: 4px solid var(--accent-blue); border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dead { opacity: 0.35; filter: grayscale(100%); border-left-color: #64748b !important; }

        #chat-box {
            background: rgba(8, 12, 20, 0.95); height: 170px; overflow-y: auto;
            padding: 12px; border-radius: 14px; margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem;
        }
        .chat-msg { margin-bottom: 6px; padding: 4px 8px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; }

        /* モーダル */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 999; padding: 16px;
        }
        .modal-overlay.open { display: flex; animation: fadeIn 0.3s ease-out; }
        .modal-content {
            background: #0f172a; border: 1px solid var(--accent-blue); border-radius: 20px;
            width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto; padding: 24px;
            box-shadow: var(--glow-blue); position: relative;
        }
        .modal-close {
            position: absolute; top: 16px; right: 20px; background: none; border: none;
            color: #fff; font-size: 1.5rem; cursor: pointer; width: auto; padding: 0; box-shadow: none;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <!-- ナビゲーションバー -->
    <div class="navbar">
        <div class="user-info">
            <img id="my-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" class="avatar-img" alt="Avatar">
            <div>
                <div id="nav-username" style="font-weight: 700; font-size: 0.95rem;">ゲスト</div>
                <span class="pt-badge">🪙 <span id="user-pt">0</span> PT</span>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="auth-btn" class="btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.85rem;" onclick="openAuthModal()">🔑 ログイン</button>
            <button class="btn-gold" style="width: auto; padding: 6px 14px; font-size: 0.85rem;" onclick="showScreen('screen-shop')">🛒 ショップ</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="game-panel">
            <h1>ONLINE JINRO</h1>

            <!-- 1. ロビー画面 -->
            <div id="screen-lobby" class="screen active">
                <h2>🎮 ロビー</h2>
                <div style="margin: 18px 0;">
                    <button class="btn-purple" style="padding: 14px;" onclick="joinRandomRoom()">🎲 Quick Join (ランダム対戦)</button>
                    <p style="text-align: center; font-size: 0.8rem; color: var(--text-sub); margin: 12px 0;">またはプライベートIDで参加</p>
                    <input type="text" id="room-code" placeholder="部屋ID (例: 7777)">
                    <button onclick="joinRoom()">部屋を作成 / 入室</button>
                </div>
            </div>

            <!-- 2. ショップ画面 -->
            <div id="screen-shop" class="screen">
                <h2>🛒 ポイントショップ</h2>
                <p style="text-align:center; color:var(--text-sub); margin-bottom:12px;">所持PTを使ってアバターや称号を獲得！</p>
                <div class="player-card">
                    <span>🔮 占い用水晶玉 (アバター装飾)</span>
                    <button class="action-btn" onclick="buyItem('crystal', 200)">200 PTで購入</button>
                </div>
                <button class="btn-secondary" style="margin-top: 18px;" onclick="showScreen('screen-lobby')">ロビーに戻る</button>
            </div>

            <!-- 3. 待機部屋 -->
            <div id="screen-room" class="screen">
                <h2>ROOM: <span id="display-room" style="color: var(--accent-blue); font-family: 'Orbitron';"></span></h2>
                <div id="player-list"></div>
                <button onclick="startGame()" style="margin-top: 16px;">ゲームスタート</button>
            </div>

            <!-- 4. ゲーム画面 -->
            <div id="screen-game" class="screen">
                <div id="timer-display" class="timer-box">⏱️ TIME: --:--</div>

                <div class="card-container" onclick="this.classList.toggle('flipped')">
                    <div class="flipper">
                        <div class="card-front">
                            <span style="font-size: 0.8rem; color: var(--text-sub);">タップで役職を表示</span>
                            <span style="font-size: 1.4rem;">🎴</span>
                        </div>
                        <div class="card-back">
                            <span style="font-size: 0.75rem; color: var(--text-sub);">あなたの配役</span>
                            <strong id="my-role" style="font-size: 1.2rem; color: var(--accent-gold);">市民</strong>
                        </div>
                    </div>
                </div>

                <h3 id="phase-title" style="color: var(--accent-gold); text-align: center; margin-top: 8px;">進行中...</h3>
                <p id="phase-desc" style="text-align: center; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;"></p>

                <div id="game-player-list"></div>

                <div id="chat-box"></div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <select id="chat-type" style="width: 90px; margin:0;">
                        <option value="all">全体</option>
                        <option value="wolf">人狼</option>
                    </select>
                    <input type="text" id="chat-input" placeholder="メッセージ..." style="margin:0;">
                    <button onclick="sendChat()" style="width: 75px; margin:0;">送信</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="card-box">
                <h3 style="color: var(--accent-blue); font-size: 1rem; margin-bottom: 8px;">📝 推理メモ</h3>
                <textarea id="personal-memo" style="height: 200px; resize: none;" placeholder="推理や行動のメモを残せます..."></textarea>
            </div>
        </div>
    </div>
</div>

<!-- 🔑 ログイン / 新規登録モーダル -->
<div id="auth-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 400px;">
        <button class="modal-close" onclick="closeAuthModal()">✕</button>
        <h2 style="color: var(--accent-blue); text-align: center; margin-bottom: 16px;">ACCOUNT</h2>
        
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab-btn active-tab" onclick="switchAuthTab('login')">ログイン</button>
            <button id="tab-register" class="auth-tab-btn" onclick="switchAuthTab('register')">新規登録</button>
        </div>

        <input type="text" id="auth-username" placeholder="ユーザー名">
        <input type="password" id="auth-password" placeholder="パスワード">

        <button id="auth-submit-btn" onclick="submitAuth()">ログイン</button>
    </div>
</div>

<script>
    const socket = io();
    let myId = null;
    let currentUser = null;
    let authMode = 'login';
    let myRole = '市民';

    socket.on('connect', () => { myId = socket.id; });

    // ✨ 動的背景パーティクル描画
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    for(let i=0; i<40; i++) {
        particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2+1, dX: (Math.random()-0.5)*0.5, dY: (Math.random()-0.5)*0.5 });
    }
    function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        particles.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            p.x += p.dX; p.y += p.dY;
            if(p.x<0 || p.x>canvas.width) p.dX *= -1;
            if(p.y<0 || p.y>canvas.height) p.dY *= -1;
        });
        requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ⏱️ タイマー受領
    socket.on('timerUpdate', ({ timeLeft }) => {
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        document.getElementById('timer-display').innerText = `⏱️ TIME: ${min}:${sec < 10 ? '0' : ''}${sec}`;
    });

    // 🔑 ログイン管理
    function openAuthModal() { document.getElementById('auth-modal').classList.add('open'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.remove('open'); }
    function switchAuthTab(mode) {
        authMode = mode;
        document.getElementById('tab-login').classList.toggle('active-tab', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active-tab', mode === 'register');
        document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'ログイン' : 'アカウント作成';
    }

    function submitAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if (!username || !password) return alert('ユーザー名とパスワードを入力してください');

        if (authMode === 'login') socket.emit('loginUser', { username, password });
        else socket.emit('registerUser', { username, password });
    }

    socket.on('authResponse', ({ success, message, user }) => {
        alert(message);
        if (success) {
            currentUser = user;
            document.getElementById('nav-username').innerText = user.username;
            document.getElementById('user-pt').innerText = user.pt;
            document.getElementById('my-avatar').src = user.avatar;
            document.getElementById('auth-btn').style.display = 'none';
            closeAuthModal();
        }
    });

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function joinRandomRoom() {
        socket.emit('joinRandomRoom', { user: currentUser });
        showScreen('screen-room');
    }

    function joinRoom() {
        const roomCode = document.getElementById('room-code').value.trim();
        if (!roomCode) return alert('部屋IDを入力してください');
        socket.emit('joinRoom', { roomCode, user: currentUser });
        showScreen('screen-room');
        document.getElementById('display-room').innerText = roomCode;
    }

    socket.on('updateRoom', (room) => {
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        Object.values(room.players).forEach(p => {
            list.innerHTML += `
                <div class="player-card">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${p.avatar}" style="width:30px; height:30px; border-radius:50%;">
                        <span style="font-weight:700;">${p.name}</span>
                    </div>
                </div>`;
        });
    });

    function startGame() { socket.emit('startGame'); }

    socket.on('gameStarted', (room) => {
        myRole = room.players[myId].role;
        document.getElementById('my-role').innerText = myRole;
        showScreen('screen-game');
        renderNightPhase(room);
    });

    // 🌙 夜描画 (市民向けの案内も明記)
    function renderNightPhase(room) {
        document.getElementById('phase-title').innerText = "🌙 夜の行動";
        
        let desc = "能力者が行動を行っています。しばらくお待ちください…";
        if (myRole === '人狼') desc = "襲撃相手を選択してください。";
        else if (myRole === '占い師') desc = "占う相手を選択してください。";
        else if (myRole === '騎士') desc = "護衛相手を選択してください。";
        
        document.getElementById('phase-desc').innerText = desc;

        const list = document.getElementById('game-player-list');
        list.innerHTML = '';

        Object.values(room.players).forEach(p => {
            if (!p.isAlive) return;
            let btnHtml = '';
            if (p.id !== myId && ['人狼', '占い師', '騎士'].includes(myRole)) {
                btnHtml = `<button class="action-btn" onclick="sendNightAction('${p.id}')">選択</button>`;
            }
            list.innerHTML += `
                <div class="player-card">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${p.avatar}" style="width:30px; height:30px; border-radius:50%;">
                        <span style="font-weight:700;">${p.name}</span>
                    </div>
                    ${btnHtml}
                </div>`;
        });
    }

    function sendNightAction(targetId) {
        socket.emit('nightAction', { targetId });
        document.getElementById('phase-desc').innerText = "行動を送信しました。夜が終わるまで待機してください…";
        document.getElementById('game-player-list').innerHTML = '';
    }

    // ☀️ 昼描画
    socket.on('startDay', ({ room, killedIds }) => {
        document.getElementById('phase-title').innerText = "☀️ 昼の議論＆投票";
        
        let msg = killedIds && killedIds.length > 0 
            ? `${killedIds.map(id => room.players[id].name).join(', ')} さんが犠牲になりました。`
            : "昨夜は誰も死にませんでした。";
        document.getElementById('phase-desc').innerText = msg;

        const list = document.getElementById('game-player-list');
        list.innerHTML = '';

        Object.values(room.players).forEach(p => {
            list.innerHTML += `
                <div class="player-card ${!p.isAlive ? 'dead' : ''}">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${p.avatar}" style="width:30px; height:30px; border-radius:50%;">
                        <span style="font-weight:700;">${p.name} ${!p.isAlive ? '(死亡)' : ''}</span>
                    </div>
                </div>`;
        });
    });

    // 💬 チャット処理
    function sendChat() {
        const text = document.getElementById('chat-input').value.trim();
        const type = document.getElementById('chat-type').value;
        if (!text) return;
        socket.emit('sendMessage', { text, type });
        document.getElementById('chat-input').value = '';
    }

    socket.on('chatMessage', ({ sender, text }) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="chat-msg"><b>${sender}:</b> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    function buyItem(item, cost) {
        if (!currentUser) return alert('アイテムを購入するにはログインしてください');
        if (currentUser.pt < cost) return alert('PTが不足しています');
        currentUser.pt -= cost;
        document.getElementById('user-pt').innerText = currentUser.pt;
        alert('購入が完了しました！');
    }
</script>
</body>
</html>
