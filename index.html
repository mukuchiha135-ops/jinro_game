<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONLINE JINRO - Grand Master Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #06080e;
            --panel-bg: rgba(15, 21, 33, 0.88);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-red: #ff2a5f;
            --accent-blue: #00f0ff;
            --accent-gold: #ffb703;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glow-red: 0 0 20px rgba(255, 42, 95, 0.5);
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-gold: 0 0 20px rgba(255, 183, 3, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px 8px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景パーティクル用 Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
        }

        /* --- ナビゲーション --- */
        .navbar {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            padding: 12px 18px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-img {
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--accent-blue); background: #1e293b; object-fit: cover;
            box-shadow: var(--glow-blue);
        }

        .pt-badge {
            background: linear-gradient(135deg, #ffb703, #fb8500); color: #000;
            font-weight: 900; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;
            box-shadow: var(--glow-gold);
        }

        /* --- メインレイアウト --- */
        .main-layout { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 880px) {
            .main-layout { flex-direction: row; }
        }

        .game-panel {
            flex: 2.5; background: var(--panel-bg); backdrop-filter: blur(20px);
            padding: 24px; border-radius: 24px; border: 1px solid var(--panel-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); position: relative; overflow: hidden;
        }

        .game-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-purple), var(--accent-blue));
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .card-box {
            background: var(--panel-bg); backdrop-filter: blur(16px);
            padding: 18px; border-radius: 20px; border: 1px solid var(--panel-border);
        }

        h1 {
            font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900;
            text-align: center; background: linear-gradient(90deg, #ff2a5f, #00f0ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 3px; margin-bottom: 20px;
        }

        /* --- UI要素 --- */
        input, select, textarea {
            width: 100%; padding: 12px 14px; margin: 6px 0 12px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(8, 12, 20, 0.85);
            color: #fff; font-size: 0.9rem; transition: border 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent-blue); box-shadow: var(--glow-blue);
        }

        button {
            width: 100%; padding: 12px; margin: 4px 0; border-radius: 12px; border: none;
            background: linear-gradient(135deg, var(--accent-red), #e11d48);
            color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s ease; box-shadow: var(--glow-red);
        }

        button:active { transform: scale(0.98); }
        .btn-secondary { background: linear-gradient(135deg, #334155, #1e293b); box-shadow: none; }
        .btn-gold { background: linear-gradient(135deg, #ffb703, #fb8500); color: #000; box-shadow: var(--glow-gold); }
        .btn-purple { background: linear-gradient(135deg, var(--accent-purple), #7c3aed); }
        .action-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #000; font-weight: 900; width: auto; padding: 6px 16px; font-size: 0.8rem; margin: 0;
            box-shadow: var(--glow-blue);
        }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 3D カードフリップ (役職確認用) --- */
        .card-container {
            perspective: 1000px; width: 100%; max-width: 220px; height: 110px;
            margin: 12px auto; cursor: pointer;
        }
        .flipper {
            width: 100%; height: 100%; transition: 0.6s transform;
            transform-style: preserve-3d; position: relative;
        }
        .card-container.flipped .flipper { transform: rotateY(180deg); }
        .card-front, .card-back {
            width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
            border-radius: 14px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border: 1px solid var(--accent-gold);
            box-shadow: var(--glow-gold);
        }
        .card-front { background: rgba(15, 23, 42, 0.95); }
        .card-back { background: linear-gradient(135deg, #1e1b4b, #311042); transform: rotateY(180deg); }

        /* --- タイマー --- */
        .timer-box {
            background: rgba(10, 15, 26, 0.9); padding: 14px; border-radius: 16px;
            text-align: center; font-family: 'Orbitron', sans-serif; font-size: 1.5rem;
            font-weight: 900; color: var(--accent-gold); margin-bottom: 16px;
            border: 1px solid var(--accent-gold); box-shadow: var(--glow-gold); letter-spacing: 2px;
        }

        /* --- プレイヤーカード --- */
        .player-card {
            background: rgba(26, 36, 52, 0.7); padding: 12px 16px; margin: 8px 0;
            border-radius: 14px; display: flex; align-items: center; justify-content: space-between;
            border-left: 4px solid var(--accent-blue); border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }
        .player-card:hover { transform: translateX(4px); }
        .dead { opacity: 0.35; filter: grayscale(100%); border-left-color: #64748b !important; }

        /* --- チャットログ --- */
        #chat-box {
            background: rgba(8, 12, 20, 0.95); height: 170px; overflow-y: auto;
            padding: 12px; border-radius: 14px; margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem;
        }
        .chat-msg { margin-bottom: 6px; padding: 4px 8px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- バックグラウンド・パーティクル用 Canvas -->
<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="navbar">
        <div class="user-info">
            <img id="my-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Player1" class="avatar-img" alt="Avatar">
            <div>
                <div id="nav-username" style="font-weight: 700; font-size: 0.95rem;">ゲスト</div>
                <span class="pt-badge">🪙 <span id="user-pt">500</span> PT</span>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-gold" style="width: auto; padding: 6px 14px; font-size: 0.85rem;" onclick="showScreen('screen-shop')">🛒</button>
            <button class="btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.85rem;" onclick="showScreen('screen-auth')">🔐</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="game-panel">
            <h1>ONLINE JINRO</h1>

            <!-- 1. 認証画面 -->
            <div id="screen-auth" class="screen">
                <h2>🔐 アカウントログイン</h2>
                <input type="email" id="auth-email" placeholder="メールアドレス">
                <input type="password" id="auth-pass" placeholder="パスワード">
                <button onclick="login()">ログイン</button>
                <button class="btn-secondary" onclick="register()">新規登録</button>
                <button class="btn-gold" onclick="showScreen('screen-lobby')">ゲストとして続行</button>
            </div>

            <!-- 2. ロビー画面 -->
            <div id="screen-lobby" class="screen active">
                <h2>🎮 ロビー</h2>
                <input type="text" id="player-name" placeholder="プレイヤー名" value="名無し">
                <div style="margin: 18px 0;">
                    <button class="btn-purple" style="padding: 14px;" onclick="joinRandomRoom()">🎲 Quick Join (ランダム対戦)</button>
                    <p style="text-align: center; font-size: 0.8rem; color: var(--text-sub); margin: 12px 0;">またはプライベートIDで参加</p>
                    <input type="text" id="room-code" placeholder="部屋ID (例: 7777)">
                    <button onclick="joinRoom()">部屋を作成 / 入室</button>
                </div>
            </div>

            <!-- 3. ショップ画面 -->
            <div id="screen-shop" class="screen">
                <h2>🛒 ポイントショップ</h2>
                <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;">対戦で使えるアイテムを購入できます。</p>
                <button class="btn-gold" onclick="buyItem('crystal', 200)">🔮 水晶玉 (200 PT)</button>
                <button class="btn-gold" style="margin-top: 8px;" onclick="buyItem('doll', 300)">🧸 身代わり人形 (300 PT)</button>
                <button class="btn-secondary" style="margin-top: 18px;" onclick="showScreen('screen-lobby')">ロビーに戻る</button>
            </div>

            <!-- 4. 待機部屋 -->
            <div id="screen-room" class="screen">
                <h2>ROOM: <span id="display-room" style="color: var(--accent-blue); font-family: 'Orbitron';"></span></h2>
                <div id="player-list"></div>
                <button onclick="startGame()" style="margin-top: 16px;">ゲームスタート</button>
            </div>

            <!-- 5. ゲーム画面 -->
            <div id="screen-game" class="screen">
                <div id="timer-display" class="timer-box">⏱️ TIME: --:--</div>

                <!-- 3D 役職裏返しカード -->
                <div class="card-container" onclick="this.classList.toggle('flipped')">
                    <div class="flipper">
                        <div class="card-front">
                            <span style="font-size: 0.8rem; color: var(--text-sub);">タップで役職を表示</span>
                            <span style="font-size: 1.4rem;">🎴</span>
                        </div>
                        <div class="card-back">
                            <span style="font-size: 0.75rem; color: var(--text-sub);">あなたの配役</span>
                            <strong id="my-role" style="font-size: 1.2rem; color: var(--accent-gold);">?</strong>
                        </div>
                    </div>
                </div>

                <h3 id="phase-title" style="color: var(--accent-gold); text-align: center; margin-top: 8px;">進行中...</h3>
                <p id="phase-desc" style="text-align: center; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;"></p>

                <div id="game-player-list"></div>

                <div id="chat-box"></div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <select id="chat-type" style="width: 90px; margin:0;">
                        <option value="all">全体</option>
                        <option value="wolf">人狼</option>
                    </select>
                    <input type="text" id="chat-input" placeholder="メッセージ..." style="margin:0;">
                    <button onclick="sendChat()" style="width: 75px; margin:0;">送信</button>
                </div>
            </div>

            <!-- 6. 結果画面 -->
            <div id="screen-result" class="screen" style="text-align: center; padding: 20px 0;">
                <h2 id="winner-text" style="color: var(--accent-red); font-size: 2rem; font-family: 'Orbitron';"></h2>
                <button onclick="location.reload()" style="margin-top: 20px;">ロビーに戻る</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="card-box">
                <h3 style="color: var(--accent-blue); font-size: 1rem; margin-bottom: 8px;">📝 考察メモ</h3>
                <textarea id="personal-memo" style="height: 200px; resize: none;" placeholder="推理内容や発言ログを記入..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myId = null;
    let myRole = null;
    let currentRoom = null;
    let userPT = parseInt(localStorage.getItem('userPT') || '500');

    socket.on('connect', () => { myId = socket.id; });

    function updatePTDisplay() {
        document.getElementById('user-pt').innerText = userPT;
        localStorage.setItem('userPT', userPT);
    }
    updatePTDisplay();

    // --- パーティクルアニメーション演出 ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let isNight = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 40; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            speedY: Math.random() * 0.5 + 0.2,
            opacity: Math.random()
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = isNight ? 'rgba(168, 85, 247, ' : 'rgba(0, 240, 255, ';
        
        particles.forEach(p => {
            p.y -= p.speedY;
            if (p.y < 0) p.y = canvas.height;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = (isNight ? 'rgba(168, 85, 247, ' : 'rgba(0, 240, 255, ') + p.opacity + ')';
            ctx.fill();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // タイマー同期
    socket.on('timerUpdate', ({ timeLeft }) => {
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        document.getElementById('timer-display').innerText = `⏱️ TIME: ${min}:${sec < 10 ? '0' : ''}${sec}`;
    });

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function joinRandomRoom() {
        const name = document.getElementById('player-name').value.trim() || 'ゲスト';
        socket.emit('joinRandomRoom', { name, avatar: document.getElementById('my-avatar').src });
        showScreen('screen-room');
    }

    function joinRoom() {
        const name = document.getElementById('player-name').value.trim() || 'ゲスト';
        const roomCode = document.getElementById('room-code').value.trim();
        if (!roomCode) return alert('部屋IDを入力してください');
        socket.emit('joinRoom', { roomCode, name, avatar: document.getElementById('my-avatar').src });
        showScreen('screen-room');
        document.getElementById('display-room').innerText = roomCode;
    }

    socket.on('updateRoom', (room) => {
        currentRoom = room;
        const list = document.getElementById('player-list');
        list.innerHTML = '';
        Object.values(room.players).forEach(p => {
            list.innerHTML += `
                <div class="player-card">
                    <div class="player-info">
                        <img src="${p.avatar || ''}" class="avatar-img">
                        <span style="font-weight:700;">${p.name}</span>
                    </div>
                </div>`;
        });
    });

    function startGame() {
        socket.emit('startGame', { selectedRoles: ['人狼', '占い師', '騎士（狩人）'], dayTimeLimit: 180 });
    }

    socket.on('gameStarted', (room) => {
        currentRoom = room;
        myRole = room.players[myId].role;
        document.getElementById('my-role').innerText = myRole;
        showScreen('screen-game');
        renderNightPhase(room);
    });

    function renderNightPhase(room) {
        isNight = true;
        document.getElementById('phase-title').innerText = "🌙 夜の行動";
        
        let desc = "能力者は対象を選択してください。";
        if (myRole === '人狼') desc = "襲撃相手を選択してください。";
        else if (myRole === '占い師') desc = "占う相手を選択してください。";
        else if (myRole === '騎士（狩人）') desc = "護衛相手を選択してください。";
        document.getElementById('phase-desc').innerText = desc;

        const list = document.getElementById('game-player-list');
        list.innerHTML = '';

        Object.values(room.players).forEach(p => {
            if (!p.isAlive) return;
            let btnHtml = '';
            if (p.id !== myId && ['人狼', '占い師', '騎士（狩人）'].includes(myRole)) {
                btnHtml = `<button class="action-btn" onclick="sendNightAction('${p.id}')">選択</button>`;
            }
            list.innerHTML += `
                <div class="player-card">
                    <div class="player-info">
                        <img src="${p.avatar || ''}" class="avatar-img">
                        <span style="font-weight:700;">${p.name}</span>
                    </div>
                    ${btnHtml}
                </div>`;
        });
    }

    function sendNightAction(targetId) {
        socket.emit('nightAction', { targetId });
        document.getElementById('phase-desc').innerText = "行動を選択しました。待機中...";
        document.getElementById('game-player-list').innerHTML = '';
    }

    socket.on('startDay', ({ room, killedIds }) => {
        isNight = false;
        currentRoom = room;
        document.getElementById('phase-title').innerText = "☀️ 昼の議論＆投票";
        
        let msg = killedIds && killedIds.length > 0 
            ? `${killedIds.map(id => room.players[id].name).join(', ')} さんが犠牲になりました。`
            : "昨夜は誰も死にませんでした。";
        document.getElementById('phase-desc').innerText = msg + " 追放投票を行ってください。";

        const list = document.getElementById('game-player-list');
        list.innerHTML = '';
        const isMyAlive = room.players[myId].isAlive;

        Object.values(room.players).forEach(p => {
            let btnHtml = '';
            if (isMyAlive && p.isAlive && p.id !== myId) {
                btnHtml = `<button class="action-btn" onclick="sendVote('${p.id}')">投票</button>`;
            }
            list.innerHTML += `
                <div class="player-card ${!p.isAlive ? 'dead' : ''}">
                    <div class="player-info">
                        <img src="${p.avatar || ''}" class="avatar-img">
                        <span style="font-weight:700;">${p.name} ${!p.isAlive ? '(死亡)' : ''}</span>
                    </div>
                    ${btnHtml}
                </div>`;
        });
    });

    function sendVote(targetId) {
        socket.emit('castVote', { targetId });
        document.getElementById('phase-desc').innerText = "投票しました。結果を待っています...";
        document.getElementById('game-player-list').innerHTML = '';
    }

    socket.on('startNight', ({ room }) => {
        currentRoom = room;
        renderNightPhase(room);
    });

    socket.on('gameOver', ({ winner }) => {
        isNight = false;
        showScreen('screen-result');
        document.getElementById('winner-text').innerText = `${winner} の勝利！`;

        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
    });

    function sendChat() {
        const text = document.getElementById('chat-input').value.trim();
        const type = document.getElementById('chat-type').value;
        if (!text) return;
        socket.emit('sendMessage', { text, type });
        document.getElementById('chat-input').value = '';
    }

    socket.on('chatMessage', ({ sender, text }) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="chat-msg"><b>${sender}:</b> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    });

    function buyItem(itemId, cost) {
        if (userPT < cost) return alert('PT不足です');
        userPT -= cost;
        updatePTDisplay();
        alert('購入完了！');
    }

    function login() { alert('ログイン完了'); showScreen('screen-lobby'); }
    function register() { alert('登録完了'); showScreen('screen-lobby'); }
</script>
</body>
</html>
